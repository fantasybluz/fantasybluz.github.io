<!doctype html>
<!--
  Link-preview card (og:image), 1200 × 630. Rendered to public/og-<locale>.png by scripts/render-og.mjs;
  the locale comes from the URL hash (#zh / #en). Follows DESIGN.md: parchment canvas, one blue accent,
  the single "product shadow" on the photo.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        --ink: #1d1d1f;
        --muted: #6e6e73;
        --primary: #06c;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }

      body {
        display: flex;
        align-items: center;
        gap: 72px;
        padding: 0 88px;
        background: #f5f5f7;
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'PingFang TC', 'Helvetica Neue', sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .text {
        flex: 1;
      }

      .site {
        color: var(--primary);
        font-size: 28px;
        font-weight: 600;
      }

      h1 {
        margin-top: 18px;
        font-size: 80px;
        font-weight: 600;
        line-height: 1.08;
      }

      h1 small {
        display: block;
        font-size: 56px;
      }

      .role {
        margin-top: 16px;
        color: var(--muted);
        font-size: 40px;
        font-weight: 600;
      }

      .tags {
        margin-top: 40px;
        color: var(--muted);
        font-size: 26px;
      }

      .photo {
        flex: 0 0 420px;
        height: 420px;
        overflow: hidden;
        border-radius: 28px;
        box-shadow: rgb(0 0 0 / 22%) 3px 5px 30px 0;
      }

      .photo img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
    </style>
  </head>
  <body>
    <div class="text">
      <p class="site">bluz.dev</p>
      <h1 id="name"></h1>
      <p class="role" id="role"></p>
      <p class="tags" id="tags"></p>
    </div>
    <div class="photo"><img src="../../public/Bluz_Lan.jpg" alt="" /></div>
    <script>
      const copy = {
        zh: { name: '藍詠弘<small>Bluz Lan</small>', role: '軟體工程師', tags: '後端 · 前端 · 雲端 · DevOps · AI Agent' },
        en: { name: 'Bluz Lan', role: 'Software Engineer', tags: 'Backend · Frontend · Cloud · DevOps · AI agents' }
      }
      const locale = location.hash.slice(1) === 'en' ? 'en' : 'zh'
      document.documentElement.lang = locale === 'en' ? 'en' : 'zh-Hant'
      document.getElementById('name').innerHTML = copy[locale].name
      document.getElementById('role').textContent = copy[locale].role
      document.getElementById('tags').textContent = copy[locale].tags
    </script>
  </body>
</html>
