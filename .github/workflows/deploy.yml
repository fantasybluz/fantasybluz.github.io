name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # The site lives on Cloudflare Pages (https://bluz.dev, project `marklan`).
  # Needs the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets; until they are set this job
  # is skipped and the site is deployed from a laptop with `npm run deploy`.
  cloudflare-pages:
    runs-on: ubuntu-latest
    name: Build and deploy to Cloudflare Pages
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check secrets
        id: secrets
        run: echo "ready=${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.secrets.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: steps.secrets.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install and build
        if: steps.secrets.outputs.ready == 'true'
        run: |
          npm ci
          npm run build

      - name: Deploy
        if: steps.secrets.outputs.ready == 'true'
        run: npx --yes wrangler@4 pages deploy dist --project-name marklan --branch main

  # The old address (https://fantasybluz.github.io) only forwards visitors to the same path on the new site.
  github-pages-redirect:
    runs-on: ubuntu-latest
    name: Publish redirect to GitHub Pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build redirect pages
        run: node scripts/build-redirect.mjs

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          publish_dir: ./redirect-dist
          publish_branch: gh-pages
          # uses the automatically provided GITHUB_TOKEN
          github_token: ${{ secrets.GITHUB_TOKEN }}
